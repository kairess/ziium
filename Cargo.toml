[package]
name = "ziium"
version = "0.1.0"
edition = "2024"
description = "The Ziium programming language: a Korean, message-oriented language implemented in Rust."
repository = "https://github.com/ziium/ziium"
license = "MIT"
build = "build.rs"

[lib]
name = "ziium"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.114"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustyline = "17.0.2"
tch = "0.23.0"
unicode-width = "0.2.2"
